# Cover + social preview. Regenerate with Real-Fruit-Snacks/rfs-brand, from the folder holding both clones:
#   python3 rfs-brand/tools/make-cover.py port-sync/docs/assets/cover.toml
# Layout v2 (BRAND.md section 7): name, rule, the README one-liner, and one panel.
name        = "port-sync"
description = "Keeps qBittorrent's port synced to Proton VPN"   # README line 1

# What port-sync does, as a flow: the port Proton VPN forwards goes in, the
# port qBittorrent listens on comes out. Values and the log line are the ones
# the v1 cover showed (real sync.log wording; the port numbers are examples).
[panel]
kind   = "flow"
status = ["ok listening port updated: 49160 -> 48213"]

[panel.input]
label = "Proton VPN"
note  = "forwarded port"
value = "48213"
tone  = "amber"

[panel.tool]
label = "port-sync"
note  = "every 15 s"

[panel.output]
label = "qBittorrent"
note  = "listening port"
value = "48213"
tone  = "mint"
