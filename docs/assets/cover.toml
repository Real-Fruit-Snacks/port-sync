name        = "port-sync"
description = "Keeps qBittorrent's port synced to Proton VPN"

[panel]
kind   = "flow"
status = ["ok listening port updated: 48213 -> 51037"]

[panel.input]
label = "Proton VPN"
note  = "forwarded port"
value = "51037"
tone  = "steel-ink"

[panel.tool]
label = "port-sync"
note  = "every 15 s"

[panel.output]
label = "qBittorrent"
note  = "listening port"
value = "51037"
tone  = "mint"
