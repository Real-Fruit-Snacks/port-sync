# cargo-about settings. tools/third-party-licences.ps1 uses this file and about.hbs to write
# THIRD-PARTY-LICENSES.txt, which ships in every release download.
#
# A crate under a licence missing from this list fails the release, on purpose: check the
# licence before adding it here. For a crate offered under several licences
# ("MIT OR Apache-2.0"), the first one listed here is the one used.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Zlib",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
    "MPL-2.0",
]

# Only the crates that end up in port-sync.exe.
targets = ["x86_64-pc-windows-msvc"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
