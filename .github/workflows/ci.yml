name: ci

on:
  push:
    branches: ['**']   # tags run this through release.yml
  pull_request:
  workflow_call:

jobs:
  windows:
    # Unit tests under both PowerShells, plus the installer against a real Task Scheduler.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Pester and PSScriptAnalyzer
        run: |
          # The PowerShell Gallery is flaky from hosted runners: a download fails, or PSGallery
          # isn't registered at all because the gallery was unreachable when PowerShellGet first
          # loaded. Use the module if the runner image already has that version; otherwise
          # re-register the gallery if needed and install, 5 tries, 15/30/45/60 s apart.
          # The versions are in tools/versions.psd1, which the dev kit reads too.
          $modules = (Import-PowerShellDataFile tools/versions.psd1).Modules
          foreach ($m in $modules) {
            if (Get-Module -ListAvailable $m.Name | Where-Object { $_.Version -eq [version]$m.Version }) {
              Write-Host "$($m.Name) $($m.Version) is already on the runner"; continue
            }
            for ($try = 1; $true; $try++) {
              try {
                if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Write-Host 'PSGallery is not registered; registering it'
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module $m.Name -RequiredVersion $m.Version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
                Write-Host "Installed $($m.Name) $($m.Version) (try $try)"
                break
              } catch {
                if ($try -ge 5) { throw }
                Write-Warning "Installing $($m.Name) failed (try $try): $_"
                Start-Sleep -Seconds (15 * $try)
              }
            }
          }
      - name: Lint and ASCII check
        run: ./tools/lint.ps1
      - name: Test
        run: ./tools/test.ps1

  qbittorrent:
    # The sync against a real qBittorrent Web UI (qbittorrent-nox 4.6 from Ubuntu 24.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: qbittorrent-nox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qbittorrent-nox
          # The dev kit documents this version; fail if Ubuntu's package moves away from it
          want=$(pwsh -NoProfile -Command '(Import-PowerShellDataFile tools/versions.psd1).QbittorrentNox')
          have=$(dpkg-query -W -f='${Version}' qbittorrent-nox)
          echo "qbittorrent-nox $have (tools/versions.psd1: $want)"
          case "${have#*:}" in "$want"-*) ;; *) echo "qbittorrent-nox is $have, not $want; update tools/versions.psd1"; exit 1 ;; esac
          sh tests/start-qbittorrent.sh ci-pass-123
      - name: Test
        shell: pwsh
        env:
          PORT_SYNC_TEST_QBIT_URL: http://127.0.0.1:8080
          PORT_SYNC_TEST_QBIT_PASS: ci-pass-123
        run: |
          # The PowerShell Gallery is flaky from hosted runners: a download fails, or PSGallery
          # isn't registered at all because the gallery was unreachable when PowerShellGet first
          # loaded. Use the module if the runner image already has that version; otherwise
          # re-register the gallery if needed and install, 5 tries, 15/30/45/60 s apart.
          $modules = @((Import-PowerShellDataFile tools/versions.psd1).Modules | Where-Object { $_.Name -eq 'Pester' })
          foreach ($m in $modules) {
            if (Get-Module -ListAvailable $m.Name | Where-Object { $_.Version -eq [version]$m.Version }) {
              Write-Host "$($m.Name) $($m.Version) is already on the runner"; continue
            }
            for ($try = 1; $true; $try++) {
              try {
                if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Write-Host 'PSGallery is not registered; registering it'
                  Register-PSRepository -Default -ErrorAction Stop
                }
                Set-PSRepository -Name PSGallery -InstallationPolicy Trusted -ErrorAction Stop
                Install-Module $m.Name -RequiredVersion $m.Version -Repository PSGallery -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop
                Write-Host "Installed $($m.Name) $($m.Version) (try $try)"
                break
              } catch {
                if ($try -ge 5) { throw }
                Write-Warning "Installing $($m.Name) failed (try $try): $_"
                Start-Sleep -Seconds (15 * $try)
              }
            }
          }
          ./tools/test.ps1

  art:
    # The README panel is generated; fail if docs/assets/panel-*.svg no longer match docs/art/make-panel.py.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Python version
        id: pins
        shell: pwsh
        run: '"python=$((Import-PowerShellDataFile tools/versions.psd1).Python)" >> $env:GITHUB_OUTPUT'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pins.outputs.python }}
      - name: Regenerate the panel
        run: |
          python -m pip install --quiet -r docs/art/requirements.txt
          python docs/art/make-panel.py
          git diff --exit-code -- docs/assets/panel-dark.svg docs/assets/panel-light.svg
