name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    # Unit tests under both PowerShells, plus the installer against a real Task Scheduler.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v5
      - name: Pester and PSScriptAnalyzer
        run: |
          # The gallery has transient failures; try three times before failing the job.
          foreach ($m in @{ Name = 'Pester'; RequiredVersion = '5.7.1' }, @{ Name = 'PSScriptAnalyzer'; RequiredVersion = '1.25.0' }) {
            for ($i = 1; $i -le 3; $i++) {
              try { Install-Module @m -Scope CurrentUser -Force -SkipPublisherCheck -ErrorAction Stop; break }
              catch { if ($i -eq 3) { throw }; Write-Host "retry $($m.Name): $_"; Start-Sleep -Seconds (10 * $i) }
            }
          }
      - name: Lint
        run: |
          $r = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $r | Format-Table -AutoSize -Wrap
          if ($r) { Write-Host "$(@($r).Count) analyzer finding(s)"; exit 1 }
      - name: Scripts are ASCII
        run: |
          $bad = Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { (Get-Content $_.FullName -Raw) -match '[^\x00-\x7F]' }
          if ($bad) { $bad.FullName; exit 1 }
      - name: Test
        run: |
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  qbittorrent:
    # The sync against a real qBittorrent Web UI (qbittorrent-nox 4.6 from Ubuntu 24.04).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: qbittorrent-nox
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qbittorrent-nox
          sh tests/start-qbittorrent.sh ci-pass-123
      - name: Test
        shell: pwsh
        env:
          PORT_SYNC_TEST_QBIT_URL: http://127.0.0.1:8080
          PORT_SYNC_TEST_QBIT_PASS: ci-pass-123
        run: |
          for ($i = 1; $i -le 3; $i++) {
            try { Install-Module Pester -RequiredVersion 5.7.1 -Scope CurrentUser -Force -ErrorAction Stop; break }
            catch { if ($i -eq 3) { throw }; Write-Host "retry Pester: $_"; Start-Sleep -Seconds (10 * $i) }
          }
          Import-Module Pester -RequiredVersion 5.7.1
          $c = New-PesterConfiguration
          $c.Run.Path = './tests'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c
